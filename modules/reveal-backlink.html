<style>
  /* "All slides" escape hatch back to the published landing page.
     Top-left, because reveal.js puts its own menu button bottom-left. */
  .deck-backlink {
    position: fixed;
    top: 0.6em;
    left: 0.8em;
    z-index: 40;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    font-weight: 700;
    line-height: 1;
    color: #6f6659;
    text-decoration: none;
    padding: 0.4em 0.7em;
    border: 1px solid #ddd8d2;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.85);
    opacity: 0.9;
    transition: opacity 0.15s ease, background-color 0.15s ease, color 0.15s ease;
  }

  .deck-backlink:hover,
  .deck-backlink:focus-visible {
    opacity: 1;
    color: #003C71;
    border-color: #003C71;
    background: #F1EFEE;
  }

  /* Keep it out of PDF export, print, and the speaker view. */
  @media print {
    .deck-backlink { display: none; }
  }

  .reveal.overview ~ .deck-backlink,
  body.print-pdf .deck-backlink {
    display: none;
  }
</style>

<a class="deck-backlink" href="index.html" title="Back to the workshop landing page">&#8592; All slides</a>

<script>
  // The decks render to _output/modules/ but are published alongside index.html
  // in docs/. Hide the link when there is no sibling index (local preview), so
  // it never points at a 404.
  (function () {
    var link = document.querySelector('.deck-backlink');
    if (!link) return;
    if (location.protocol === 'file:') { link.style.display = 'none'; return; }
    fetch('index.html', { method: 'HEAD' })
      .then(function (r) { if (!r.ok) link.style.display = 'none'; })
      .catch(function () { link.style.display = 'none'; });
  })();
</script>
