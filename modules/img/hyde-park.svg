<?xml version="1.0" encoding="UTF-8"?>
<!-- Schematic map for Module 6's "Check it by hand" slide.
     Node positions are the real landmark coordinates projected with the same
     equirectangular formula the dnf/dist terms use (earth radius 6334.02 km),
     at 62 px per km, so on-screen distances are to scale and the scale bar is
     honest. Verified: the projected geometry reproduces the term's own
     distances as 0.733, 2.921, and 3.244 km.

     Kept as a standalone file rather than inline SVG because Pandoc ends a raw
     HTML block at the first blank line and lowercases SVG attribute names. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250"
     width="420" height="250" role="img"
     aria-label="Schematic map of three Hyde Park landmarks in Chicago, with arrows showing the three ties between them">
  <title>Three Hyde Park landmarks and the ties between them</title>

  <defs>
    <marker id="hp-tip" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"
            markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4E3629"/>
    </marker>
  </defs>

  <text x="20" y="18" font-family="Arial, Helvetica, sans-serif" font-size="14"
        font-weight="700" fill="#4E3629">Hyde Park, Chicago</text>

  <!-- ties: 1->2, 2->3, 3->1 -->
  <g stroke="#4E3629" stroke-width="2" marker-end="url(#hp-tip)">
    <line x1="169.4" y1="34.8" x2="158.1" y2="50.6"/>
    <line x1="156.8" y1="71.9" x2="244.9" y2="199.6"/>
    <line x1="248.2" y1="200.0" x2="181.7" y2="37.9"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4E3629">
    <text x="188" y="29">Promontory Point</text>
    <text x="140" y="58" text-anchor="end">Museum of Science</text>
    <text x="140" y="74" text-anchor="end">&amp; Industry</text>
    <text x="264" y="210">South Shore</text>
    <text x="264" y="226">Cultural Center</text>
  </g>

  <!-- nodes, filled by category: navy = cat 1, red = cat 2 -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700"
     fill="#ffffff" text-anchor="middle">
    <circle cx="176.4" cy="25" r="9" fill="#003C71"/><text x="176.4" y="29">1</text>
    <circle cx="150" cy="62" r="9" fill="#003C71"/><text x="150" y="66">2</text>
    <circle cx="252.8" cy="211.1" r="9" fill="#ED1C24"/><text x="252.8" y="215">3</text>
  </g>

  <!-- scale bar (1 km = 62 px) and north arrow -->
  <g stroke="#4E3629" stroke-width="1.5" fill="none">
    <line x1="30" y1="232" x2="92" y2="232"/>
    <line x1="30" y1="228" x2="30" y2="236"/>
    <line x1="92" y1="228" x2="92" y2="236"/>
    <path d="M 390 48 L 390 28 M 385 34 L 390 27 L 395 34"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4E3629">
    <text x="61" y="224" text-anchor="middle">1 km</text>
    <text x="390" y="62" text-anchor="middle">N</text>
    <circle cx="160" cy="240" r="5" fill="#003C71"/><text x="170" y="244">cat 1</text>
    <circle cx="225" cy="240" r="5" fill="#ED1C24"/><text x="235" y="244">cat 2</text>
  </g>
</svg>
