project:
  type: default
  output-dir: _output
  render:
    - modules/*.qmd
    - "!modules/archive/"

format:
  revealjs:
    theme: simple
    # Stops the deck from swallowing Cmd/Ctrl chords (e.g. Shift-Option-Command
    # -Left/Right, which reveal.js otherwise treats as jump-to-first/last-slide).
    # reveal-backlink.html adds the "All slides" link back to index.html.
    include-after-body:
      - modules/reveal-keyboard.html
      - modules/reveal-backlink.html
    slide-number: true
    # Quarto's default. Each slide change is pushed onto the browser history, so
    # Back steps backwards through slides rather than leaving the deck. That is
    # fine now that reveal-backlink.html gives an explicit "All slides" link;
    # set this to false if you would rather Back return to the landing page.
    history: true
    embed-resources: true   # self-contained HTML (assets inlined) for a portable archive
    chalkboard: false
    code-fold: false
    code-line-numbers: false
    highlight-style: github
    execute:
      echo: true
      eval: false   # participants run code themselves; set to true for instructor key
      warning: false
      message: false
    footer: "From Mixing Data to Networked Populations · SSC 2026"
